name = "lagent-tips"
main = "src/index.js"
compatibility_date = "2026-05-12"

# Custom domain (décommenter après DNS tips.theagentweekly.com) :
routes = [
   { pattern = "tips.theagentweekly.com", custom_domain = true }
]

[vars]
SERVICE_URL = "https://tips.theagentweekly.com"

# Secrets (wrangler secret put) :
#   TIP_HARVEST_TOKEN  — Bearer pour GET /v1/tips
#   IP_HASH_SALT       — sel pour hasher les IP (rate-limit)

[[kv_namespaces]]
binding = "TIPS_KV"
id = "d3013647803546199c2ef03158c65728"
preview_id = "06bba5c7c61d4251a9d61e0918d3a571"
